<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MILMO – Multimédia et Matériel</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F3864">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MILMO">
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
         background: #1F3864; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  img { width: 140px; height: 140px; border-radius: 50%; background: #fff; box-shadow: 0 6px 24px rgba(0,0,0,.35); }
  h1 { font-size: 20px; margin: 18px 0 4px; }
  p { margin: 6px 0; color: #dfe6f3; max-width: 340px; line-height: 1.45; }
  .btn { display: inline-block; margin-top: 18px; padding: 13px 22px; border-radius: 12px; border: 0; font-size: 16px; font-weight: 700;
         background: #C9A227; color: #1F3864; text-decoration: none; cursor: pointer; }
  .sec { background: transparent; color: #fff; border: 1px solid #8ea0c4; }
  .aide { margin-top: 22px; font-size: 14px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <img src="icon-192.png" alt="MILMO">
  <h1>Multimédia et Matériel</h1>
  <p>Planning mensuel et évaluations</p>
  <div id="installer-zone" hidden><button class="btn" id="installer">Installer l’application</button></div>
  <a class="btn sec" id="ouvrir" href="#">Ouvrir l’application</a>
  <div class="aide" id="aide">
    <p><b>Pour l’installer sur votre téléphone :</b></p>
    <p>Android (Chrome) : menu ⋮ puis « Installer l’application » ou « Ajouter à l’écran d’accueil ».</p>
    <p>iPhone (Safari) : bouton Partager puis « Sur l’écran d’accueil ».</p>
  </div>
<script>
  // Coller ici l'URL obtenue dans Apps Script (Déployer > Gérer les déploiements), terminée par /exec
  var URL_APP = 'https://script.google.com/macros/s/AKfycbyArxiEE5R52vH-Tm4-rbgQGOqURQCAgT4h8qfoK6WtXQ1xerIQjTbaOTwvVstCT0Rj/exec';

  document.getElementById('ouvrir').href = URL_APP;
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  var lanceeDepuisIcone = /[?&]app=1\b/.test(location.search)
    || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  if (lanceeDepuisIcone) {
    document.getElementById('aide').hidden = true;
    location.replace(URL_APP);
  }
  var invite = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); invite = e;
    document.getElementById('installer-zone').hidden = false;
  });
  document.getElementById('installer').addEventListener('click', function () {
    if (!invite) return;
    invite.prompt();
    invite.userChoice.finally(function () { invite = null; document.getElementById('installer-zone').hidden = true; });
  });
</script>
</body>
</html>
